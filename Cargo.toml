[workspace]
resolver = "2"
members = ["crates/booklet-core", "crates/booklet-cli", "crates/booklet-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mirecta/booklet-pdf"

[workspace.dependencies]
booklet-core = { path = "crates/booklet-core" }
lopdf = { version = "0.45", default-features = false, features = ["rayon"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }

# Rasterizér náhľadov je bez optimalizácií nepoužiteľne pomalý, ale náš
# vlastný kód chceme mať pri debugovaní nedotknutý.
[profile.dev.package."*"]
opt-level = 2
